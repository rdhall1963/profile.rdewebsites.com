  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lightbox__close" aria-label="Close (Esc)">&times;</button>
    <img id="lightbox-img" alt="">
  </div>

  <script>
    (function () {
      const gallery = document.querySelector('.gallery');
      const overlay = document.getElementById('lightbox');
      const bigImg  = document.getElementById('lightbox-img');
      const closeBtn = overlay.querySelector('.lightbox__close');

      if (!gallery) return;

      // The key event listener: When an image is clicked, it populates the lightbox and opens it.
      gallery.addEventListener('click', (e) => {
        const img = e.target.closest('img');
        if (!img) return;

        // 1. Set the source (src) of the large image to the source of the clicked image
        bigImg.src = img.src; 
        bigImg.alt = img.alt || 'Full-screen gallery image';

        // 2. Add the 'is-open' class to the overlay to display it (as defined in your CSS)
        overlay.classList.add('is-open');
        document.body.classList.add('modal-open');
        closeBtn.focus(); // Good for accessibility: focus on the close button
      });

      // Close helper function (called by button, overlay click, or Escape key)
      function closeLightbox() {
        // 1. Remove the classes to hide the lightbox and re-enable body scroll
        overlay.classList.remove('is-open');
        document.body.classList.remove('modal-open');
        
        // 2. Clear the image source to stop memory leaks
        bigImg.removeAttribute('src'); 
      }
      
      // Close Listeners
      closeBtn.addEventListener('click', closeLightbox); // Close button (X) click
      overlay.addEventListener('click', (e) => { // Click on the dark background area
        if (e.target === overlay) closeLightbox();
      });
      document.addEventListener('keydown', (e) => { // Escape key press
        if (e.key === 'Escape' && overlay.classList.contains('is-open')) {
          closeLightbox();
        }
      });
    })();
  </script>
</body>
